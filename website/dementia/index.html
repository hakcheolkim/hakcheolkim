<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나는 치매 예방 생활습관을 얼마나 실천하고 있을까?</title><style>body{font-family:system-ui,'Malgun Gothic',sans-serif;background:#f4f7f6;color:#172b28;margin:0}main{max-width:720px;margin:auto;padding:18px}header,.group,#result{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0001}h1{font-size:1.65rem;line-height:1.4}h2{font-size:1.25rem;color:#176b5a}.notice{background:#e6f2ef;padding:13px;border-radius:10px;line-height:1.7}.question{border-top:1px solid #e3e9e6;padding:17px 0}.question p{font-weight:600;line-height:1.5}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices label{border:1px solid #cadbd5;padding:10px;border-radius:9px;font-size:.9rem;cursor:pointer}.choices label:has(input:checked){background:#d3eee4;border-color:#15816a}button{padding:13px 19px;border:0;border-radius:10px;background:#14765f;color:white;font-size:1rem;cursor:pointer}button.secondary{background:#526761}#result{display:none}small{color:#576761}#status{font-weight:600}.result-head{border:1px solid #dbe5e0;border-radius:16px;padding:22px;margin-top:14px}.result-title{font-size:1.45rem;font-weight:800;margin:0 0 18px}.score{font-size:2.5rem;font-weight:850;letter-spacing:-1px}.score span{font-size:1.25rem;color:#6a7470;font-weight:400}.result-desc{line-height:1.8;margin:20px 0 25px}.metric{display:grid;grid-template-columns: minmax(105px,1fr) minmax(90px,2fr) auto;align-items:center;gap:12px;margin:17px 0;font-size:.95rem}.track{height:13px;background:#edf0ee;border-radius:15px;overflow:hidden}.fill{height:100%;background:#419783;border-radius:15px}.metric-value{white-space:nowrap;text-align:right}.plan{margin-top:25px;padding-top:18px;border-top:1px solid #e5ece8}.plan input{display:block;width:95%;margin:9px 0;padding:12px;border:1px solid #ccd8d3;border-radius:8px;font-size:1rem}@media(max-width:400px){.metric{grid-template-columns:105px 1fr 45px;gap:8px;font-size:.83rem}.result-head{padding:15px}}@media print{body{background:white}header,#form,#status,main>button{display:none!important}#result{display:block!important;box-shadow:none}} </style></head><body><main><header><h1>나는 치매 예방 생활습관을 얼마나 실천하고 있을까?</h1><p class="notice">이 진단지는 치매 여부를 판정하는 의학적 검사가 아니라 치매 위험을 줄이는 생활습관 실천도를 평가하는 교육용 도구입니다.</p><p>최근 한 달간의 생활을 떠올리며 응답하세요. 조건이 해당하지 않는 문항은 ‘해당 없음’을 선택하세요.</p><p><b>응답:</b> 매우 그렇다 5점 · 그렇다 4점 · 보통이다 3점 · 그렇지 않다 2점 · 전혀 그렇지 않다 1점</p><small>일부 문항의 시간·횟수는 교육용 실천 목표이며 의학적 경계값이 아닙니다. 문항의 성격에 따라 5점 응답이 부정확할 수 있습니다.</small></header><div id="form"></div><p id="status"></p><button onclick="calculate()">결과 확인하기</button> <button class="secondary" onclick="window.print()">인쇄하기</button><section id="result" aria-live="polite"></section></main><script>const groups=[["신체활동","일주일에 5일 이상 하루 30분씩 빠르게 걷거나 유산소운동을 한다","일주일에 2일 이상 근력운동을 한다","앉아 있을 때 한 시간마다 일어나 몸을 움직인다","하루 7천 보 안팎을 걷거나 내 체력에 맞는 걷기 목표를 실천한다","일주일에 3일 이상 균형운동이나 스트레칭을 한다"],["식생활·기호습관","하루 두 끼 이상 채소를 곁들여 먹는다","일주일에 두 번 이상 생선이나 콩류를 먹는다","과일과 무염 견과류를 적당량 먹는다","술을 마시지 않거나 과음을 피한다","흡연과 간접흡연을 피한다"],["수면·휴식","내게 적절한 시간 동안 충분히 잠을 잔다","취침·기상 시간을 규칙적으로 유지한다","잠들기 한 시간 전 스마트폰·TV 이용을 줄인다","코골이나 수면무호흡이 의심되면 진료를 받는다","지속적인 수면 문제는 전문가와 상담한다"],["두뇌활동","일주일에 세 번 이상 20분씩 책이나 신문을 읽는다","일주일에 두 번 이상 새로운 지식이나 기술을 배운다","일주일에 두 번 이상 퍼즐·바둑 등 사고 활동을 한다","매달 한 번 이상 새로운 장소나 활동을 경험한다","스스로 계획을 세우고 문제를 해결하는 활동을 한다"],["사회적 관계","일주일에 두 번 이상 가족·친구와 의미 있는 대화를 나눈다","일주일에 한 번 이상 지인을 직접 만난다","한 달에 두 번 이상 모임이나 강좌에 참여한다","한 달에 한 번 이상 다른 사람을 돕는 활동에 참여한다","어려움을 의논할 수 있는 사람과 연락을 유지한다"],["정서관리","일주일에 세 번 이상 즐거움이나 보람을 느끼는 활동을 한다","스트레스가 쌓이면 산책·대화 등으로 해소한다","하루 한 번 감사하거나 긍정적인 일을 떠올린다","우울감이 2주 이상 지속되면 전문가의 도움을 받는다","일주일에 한 번 이상 좋아하는 취미활동을 한다"],["건강관리","혈압을 정기적으로 확인한다","혈당·당화혈색소를 필요에 따라 확인한다","콜레스테롤 수치를 정기적으로 확인한다","만성질환이 있다면 치료와 진료 일정을 지킨다","체중과 허리둘레를 정기적으로 확인한다"],["감각·안전","청력이 떨어지면 검사를 받고 필요한 조치를 한다","시력 변화가 있으면 검진과 교정을 받는다","머리 부상 위험이 있는 활동에서는 보호장비를 착용한다","미세먼지가 심할 때 노출을 줄인다","기억력 변화가 걱정되면 의료진과 상담한다"]];const labels=['매우 그렇다','그렇다','보통이다','그렇지 않다','전혀 그렇지 않다','해당 없음'];let count=0;document.getElementById('form').innerHTML=groups.map((g,i)=>'<section class="group"><h2>'+(i+1)+'. '+g[0]+'</h2>'+g.slice(1).map(q=>{let id=count++;return '<div class="question"><p>'+(id+1)+'. '+q+'</p><div class="choices">'+labels.map((l,k)=>'<label><input type="radio" name="q'+id+'" value="'+(k===5?'na':5-k)+'"> '+l+'</label>').join('')+'</div></div>'}).join('')+'</section>').join('');function calculate(){let values=[];for(let i=0;i<40;i++){let v=document.querySelector('input[name=q'+i+']:checked');if(!v){document.getElementById('status').textContent=(i+1)+'번 문항부터 응답해 주세요.';document.querySelector('input[name=q'+i+']').scrollIntoView({behavior:'smooth',block:'center'});return}values.push(v.value)}let n=values.filter(x=>x!=='na').length,s=values.reduce((a,x)=>a+(x==='na'?0:Number(x)),0),max=n*5;let sections=groups.map((g,i)=>{let v=values.slice(i*5,i*5+5).filter(x=>x!=='na').map(Number);return {name:g[0],n:v.length,sum:v.reduce((a,b)=>a+b,0),max:v.length*5,avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:null}});let ranked=sections.filter(x=>x.avg!==null).sort((a,b)=>a.avg-b.avg);document.getElementById('status').textContent='';let r=document.getElementById('result');r.style.display='block';r.innerHTML='<div class="result-head"><div class="result-title">나의 뇌 건강 생활습관 실천도</div><div class="score">'+s+'점 <span>/ '+max+'점</span></div><p class="result-desc">높은 점수는 설문에서 제시한 생활습관을 더 자주 실천한다는 뜻입니다. 치매 발병 위험이나 예방 효과를 수치로 예측하는 점수는 아닙니다.</p>'+sections.map(x=>'<div class="metric"><div>'+x.name+'</div><div class="track"><div class="fill" style="width:'+(x.max?x.sum/x.max*100:0)+'%"></div></div><div class="metric-value">'+(x.max?x.sum+'/'+x.max:'제외')+'</div></div>').join('')+'<div class="plan"><h3>실천을 보완할 영역</h3><p>'+(ranked.slice(0,3).map(x=>x.name).join(' · ')||'평가 가능한 영역 없음')+'</p><h3>나의 30일 실천계획</h3><p>앞으로 한 달 동안 실천할 행동을 적어보세요.</p><input placeholder="실천 목표 1" aria-label="실천 목표 1"><input placeholder="실천 목표 2" aria-label="실천 목표 2"><input placeholder="실천 목표 3" aria-label="실천 목표 3"><p><small>응답 '+n+'문항 · 해당 없음 '+(40-n)+'문항. 해당 없음은 점수와 최고점에서 제외됩니다. 이 결과는 의학적 진단이 아닙니다.</small></p><button onclick="window.print()">결과 인쇄하기</button></div></div>';r.scrollIntoView({behavior:'smooth'})}</script></body></html>
